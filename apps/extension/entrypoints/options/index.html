<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sprachweise — Settings</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        color: #1f2933;
        background: #f8f9fa;
      }
      #root {
        max-width: 640px;
        margin: 0 auto;
        padding: 24px;
      }
      h1 {
        font-size: 20px;
      }
      h2 {
        font-size: 16px;
        margin-top: 24px;
      }
      nav {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      nav button {
        border: 1px solid #cbd2d9;
        background: #fff;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 13px;
      }
      nav button[aria-current="true"] {
        background: #1f2933;
        color: #fff;
        border-color: #1f2933;
      }
      .stats {
        display: flex;
        gap: 16px;
      }
      .stats > div {
        background: #fff;
        border: 1px solid #e4e7eb;
        border-radius: 8px;
        padding: 12px 16px;
        text-align: center;
      }
      .stats strong {
        display: block;
        font-size: 22px;
      }
      .stats span {
        font-size: 12px;
        color: #52606d;
      }
      ul {
        padding-left: 18px;
      }
      label {
        display: block;
        margin-bottom: 12px;
        font-size: 14px;
      }
      select,
      input[type="text"] {
        display: block;
        margin-top: 4px;
        padding: 6px 8px;
        border: 1px solid #cbd2d9;
        border-radius: 6px;
        font-size: 14px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      td,
      th {
        text-align: left;
        padding: 6px 4px;
        border-bottom: 1px solid #e4e7eb;
      }
      button.action {
        border: 1px solid #cbd2d9;
        background: #fff;
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
